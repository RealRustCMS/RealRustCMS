<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500;600;700&family=Poiret+One&display=swap" rel="stylesheet">
<style>
@keyframes cursorBlink { 0%,100%{opacity:1} 50%{opacity:0} }
@keyframes heroGlow { 0%,100%{text-shadow:0 0 20px rgba(50,205,50,.3),0 0 40px rgba(50,205,50,.1)} 50%{text-shadow:0 0 30px rgba(50,205,50,.5),0 0 60px rgba(50,205,50,.2)} }
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);transition:background .3s,color .3s;font-family:'Libre Baskerville',Georgia,serif}
a{text-decoration:none}
:root{--bg:#0A0A0A;--bg2:#111;--bg3:#1a1a1a;--bg4:#222;--border:rgba(255,255,255,.08);--text:#e0e0e0;--text2:#999;--text3:#666;--green:#32CD32;--green-dim:rgba(50,205,50,.15);--green-bright:rgba(50,205,50,.6);--gold:#C9A84C;--gold-dim:rgba(201,168,76,.15);--gold-bright:rgba(201,168,76,.5);--card-bg:#141414;--card-border:rgba(255,255,255,.06);--serif:'Libre Baskerville',Georgia,serif;--mono:'JetBrains Mono',monospace;--display:'Poiret One',sans-serif}
[data-theme="light"]{--bg:#FAFAF7;--bg2:#F0EEE9;--bg3:#E8E5DD;--bg4:#DDD9CF;--border:rgba(0,0,0,.08);--text:#1a1a1a;--text2:#555;--text3:#888;--green:#1a8a1a;--green-dim:rgba(26,138,26,.1);--green-bright:rgba(26,138,26,.4);--gold:#8B7230;--gold-dim:rgba(139,114,48,.1);--gold-bright:rgba(139,114,48,.3);--card-bg:#fff;--card-border:rgba(0,0,0,.06)}
@media(max-width:768px){.sidebar{display:none!important}.article-layout{flex-direction:column!important}.masonry{columns:2!important}.nav-links{display:none!important}.hamburger{display:flex!important}}
@media(max-width:480px){.masonry{columns:1!important}.grid-articles{grid-template-columns:1fr!important}.grid-features{grid-template-columns:1fr!important}.grid-galleries{grid-template-columns:1fr!important}}
</style>
<title>Galerias — RustCMS</title>
</head>
<body>
<header style="position:fixed;top:0;left:0;right:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);backdrop-filter:blur(12px);transition:background .3s">
<div style="max-width:1200px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between">
<a href="home.html" style="display:flex;align-items:center;gap:12px;color:var(--text)">
<div style="width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--gold);position:relative">
<span style="font-family:var(--mono);font-size:18px;color:var(--green);font-weight:700">></span>
<div style="position:absolute;top:-3px;left:-3px;width:6px;height:6px;border-top:1.5px solid var(--gold);border-left:1.5px solid var(--gold)"></div>
<div style="position:absolute;top:-3px;right:-3px;width:6px;height:6px;border-top:1.5px solid var(--gold);border-right:1.5px solid var(--gold)"></div>
<div style="position:absolute;bottom:-3px;left:-3px;width:6px;height:6px;border-bottom:1.5px solid var(--gold);border-left:1.5px solid var(--gold)"></div>
<div style="position:absolute;bottom:-3px;right:-3px;width:6px;height:6px;border-bottom:1.5px solid var(--gold);border-right:1.5px solid var(--gold)"></div>
</div>
<span style="font-family:var(--display);font-size:22px;letter-spacing:2px">RustCMS</span>
</a>
<nav style="display:flex;align-items:center;gap:32px" class="nav-links">
<a href="home.html" style="font-family:var(--mono);font-size:13px;color:var(--text2);letter-spacing:1px">Home</a>
<a href="artigos.html" style="font-family:var(--mono);font-size:13px;color:var(--text2);letter-spacing:1px">Artigos</a>
<a href="galerias.html" style="font-family:var(--mono);font-size:13px;color:var(--green);letter-spacing:1px">Galerias</a>
<button onclick="toggleTheme()" id="themeBtn" style="background:none;border:1px solid var(--border);border-radius:6px;padding:6px 10px;cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--text2)">☀</button>
</nav>
</div>
</header>
<main style="padding-top:64px">
<section style="max-width:1200px;margin:0 auto;padding:80px 24px">
<nav style="font-family:var(--mono);font-size:12px;color:var(--text3);margin-bottom:40px;display:flex;gap:8px;align-items:center">
<a href="home.html" style="color:var(--text3)">Home</a>
<span style="color:var(--gold)">›</span>
<span style="color:var(--text2)">Galerias</span>
</nav>
<div style="margin-bottom:48px">
<span style="font-family:var(--mono);font-size:12px;color:var(--gold);letter-spacing:4px">ÁLBUNS</span>
<h1 style="font-family:var(--serif);font-size:clamp(32px,5vw,48px);color:var(--text);margin:12px 0 0;font-weight:400">Galerias</h1>
</div>
<div class="grid-galleries" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px">
<a href="galeria.html" style="border-radius:8px;overflow:hidden;position:relative;display:block">
<div style="height:280px;background:linear-gradient(135deg,#1a2a1a,#0d1f0d);position:relative">
<div style="position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.7) 0%,transparent 60%)"></div>
<div style="position:absolute;bottom:0;left:0;right:0;padding:24px">
<h3 style="font-family:var(--serif);font-size:18px;color:#fff;margin:0 0 6px;font-weight:400">Screenshots da Interface</h3>
<span style="font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.6);letter-spacing:1px">12 fotos</span>
</div>
</div>
</a>
<a href="galeria.html" style="border-radius:8px;overflow:hidden;position:relative;display:block">
<div style="height:220px;background:linear-gradient(135deg,#1a1a2a,#0d0d1f);position:relative">
<div style="position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.7) 0%,transparent 60%)"></div>
<div style="position:absolute;bottom:0;left:0;right:0;padding:24px">
<h3 style="font-family:var(--serif);font-size:18px;color:#fff;margin:0 0 6px;font-weight:400">Arquitetura & Diagramas</h3>
<span style="font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.6);letter-spacing:1px">8 fotos</span>
</div>
</div>
</a>
<a href="galeria.html" style="border-radius:8px;overflow:hidden;position:relative;display:block">
<div style="height:260px;background:linear-gradient(135deg,#2a1a1a,#1f0d0d);position:relative">
<div style="position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.7) 0%,transparent 60%)"></div>
<div style="position:absolute;bottom:0;left:0;right:0;padding:24px">
<h3 style="font-family:var(--serif);font-size:18px;color:#fff;margin:0 0 6px;font-weight:400">Deploy & DevOps</h3>
<span style="font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.6);letter-spacing:1px">6 fotos</span>
</div>
</div>
</a>
<a href="galeria.html" style="border-radius:8px;overflow:hidden;position:relative;display:block">
<div style="height:200px;background:linear-gradient(135deg,#1a2a2a,#0d1f1f);position:relative">
<div style="position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.7) 0%,transparent 60%)"></div>
<div style="position:absolute;bottom:0;left:0;right:0;padding:24px">
<h3 style="font-family:var(--serif);font-size:18px;color:#fff;margin:0 0 6px;font-weight:400">Editor Rich Text</h3>
<span style="font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.6);letter-spacing:1px">10 fotos</span>
</div>
</div>
</a>
<a href="galeria.html" style="border-radius:8px;overflow:hidden;position:relative;display:block">
<div style="height:300px;background:linear-gradient(135deg,#2a2a1a,#1f1f0d);position:relative">
<div style="position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.7) 0%,transparent 60%)"></div>
<div style="position:absolute;bottom:0;left:0;right:0;padding:24px">
<h3 style="font-family:var(--serif);font-size:18px;color:#fff;margin:0 0 6px;font-weight:400">Painel Admin</h3>
<span style="font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.6);letter-spacing:1px">15 fotos</span>
</div>
</div>
</a>
<a href="galeria.html" style="border-radius:8px;overflow:hidden;position:relative;display:block">
<div style="height:240px;background:linear-gradient(135deg,#2a1a2a,#1f0d1f);position:relative">
<div style="position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.7) 0%,transparent 60%)"></div>
<div style="position:absolute;bottom:0;left:0;right:0;padding:24px">
<h3 style="font-family:var(--serif);font-size:18px;color:#fff;margin:0 0 6px;font-weight:400">Mobile Views</h3>
<span style="font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.6);letter-spacing:1px">9 fotos</span>
</div>
</div>
</a>
</div>
</section>
</main>
<footer style="background:var(--bg2);border-top:1px solid var(--border);padding:48px 24px">
<div style="max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:20px">
<div style="display:flex;align-items:center;gap:12px">
<span style="font-family:var(--display);font-size:18px;color:var(--text);letter-spacing:2px">RustCMS</span>
<span style="font-family:var(--mono);font-size:11px;color:var(--text3)">v4.0</span>
</div>
<div style="font-family:var(--mono);font-size:11px;color:var(--text3);display:flex;gap:24px">
<a href="#" style="color:var(--text3)">GitHub</a>
<a href="#" style="color:var(--text3)">Docs</a>
<a href="#" style="color:var(--text3)">Licença MIT</a>
</div>
<div style="font-family:var(--mono);font-size:11px;color:var(--text3)">
Feito com <span style="color:var(--green)">Rust</span> + <span style="color:var(--gold)">Axum</span>
</div>
</div>
</footer>
<script>
function toggleTheme(){
var t=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
document.documentElement.setAttribute('data-theme',t);
localStorage.setItem('rustcms-theme-mode',t);
document.getElementById('themeBtn').textContent=t==='dark'?'☀':'☾';
}
(function(){var s=localStorage.getItem('rustcms-theme-mode');if(s){document.documentElement.setAttribute('data-theme',s);if(s==='light')document.getElementById('themeBtn').textContent='☾';}})();
</script>
</body>
</html>
