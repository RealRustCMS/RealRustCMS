[package]
name = "rustcms"
version = "0.1.0"
edition = "2021"
default-run = "rustcms"

[[bin]]
name = "rustcms"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["multipart"] }

# Runtime assíncrono
tokio = { version = "1", features = ["full"] }

# Banco de dados
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid"] }

# Templates HTML
tera = "1"

# Serialização
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Middleware HTTP
tower-http = { version = "0.6", features = ["fs", "trace", "set-header", "limit"] }

# Sessões
tower-sessions = { version = "0.14", features = ["signed"] }
tower-sessions-sqlx-store-chrono = { version = "0.14", features = ["postgres"] }

# Hash de senhas
argon2 = "0.5"

# IDs únicos
uuid = { version = "1", features = ["v4"] }

# Datas
chrono = { version = "0.4", features = ["serde"] }

# Variáveis de ambiente
dotenvy = "0.15"

# Logs
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Geração de tokens
rand = "0.8"

# Cliente HTTP
reqwest = { version = "0.12", features = ["json"] }

# HashMap concorrente (thread-safe)
dashmap = "6"

# Inicialização lazy de estáticos
once_cell = "1"

# Codificação/decodificação de formulários URL
form_urlencoded = "1"

# Codificação/decodificação de base64
base64 = "0.22"

# Codificação/decodificação de URL
urlencoding = "2"

# MFA / TOTP (Google Authenticator, Microsoft Authenticator)
totp-rs = { version = "5", features = ["gen_secret", "qr"] }

# Envio de e-mail via SMTP
lettre = { version = "0.11", features = ["tokio1", "tokio1-native-tls"] }
ammonia = "4.1.4"

# Comparação de strings em tempo constante (CSRF)
constant_time_eq = "0.3"
