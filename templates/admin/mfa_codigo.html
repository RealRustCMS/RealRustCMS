<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <title>Verificação em dois fatores — {{ site_nome }}</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{{ asset(path='css/temas/' ~ tema ~ '.css') | safe }}">
        <style>
            *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
            body {
                font-family: 'DM Sans', sans-serif;
                background: var(--bg-page);
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
            }
            .card {
                background: var(--bg-surface);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 36px 32px;
                width: 100%;
                max-width: 360px;
                box-shadow: 0 4px 24px var(--accent-shadow);
            }
            .logo-wrap {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 24px;
            }
            .logo-mark {
                width: 32px;
                height: 32px;
                background: var(--accent);
                border-radius: 8px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 14px;
                font-weight: 700;
                color: #fff;
                flex-shrink: 0;
            }
            h1 {
                font-size: 16px;
                font-weight: 600;
                color: var(--text-primary);
                line-height: 1.2;
            }
            h1 span {
                display: block;
                font-size: 11px;
                font-weight: 400;
                color: var(--text-muted);
                margin-top: 2px;
            }
            .instrucao {
                font-size: 13px;
                color: var(--text-secondary);
                margin-bottom: 20px;
                line-height: 1.5;
            }
            label {
                font-size: 12px;
                font-weight: 500;
                color: var(--text-secondary);
                display: block;
                margin-bottom: 5px;
            }
            input {
                width: 100%;
                padding: 9px 12px;
                border: 1px solid var(--border);
                border-radius: 7px;
                font-size: 22px;
                font-family: 'DM Sans', sans-serif;
                color: var(--text-primary);
                background: var(--bg-surface);
                margin-bottom: 14px;
                outline: none;
                transition: border-color 0.15s;
                letter-spacing: 6px;
                text-align: center;
            }
            input:focus { border-color: var(--accent); }
            button {
                width: 100%;
                padding: 10px;
                border-radius: 7px;
                font-size: 14px;
                font-weight: 500;
                font-family: 'DM Sans', sans-serif;
                cursor: pointer;
                transition: background 0.15s;
                background: var(--accent);
                color: #fff;
                border: none;
            }
            button:hover { background: var(--accent-hover); }
            .voltar {
                display: block;
                text-align: center;
                margin-top: 16px;
                font-size: 12.5px;
                color: var(--text-muted);
                text-decoration: none;
            }
            .voltar:hover { color: var(--text-secondary); }
            .erro {
                color: var(--danger);
                font-size: 12.5px;
                padding: 10px 14px;
                background: var(--danger-bg);
                border: 1px solid var(--danger-bdr);
                border-radius: 7px;
                margin-bottom: 14px;
            }
            .icone-mfa {
                width: 48px;
                height: 48px;
                background: var(--bg-elevated);
                border: 1px solid var(--border);
                border-radius: 12px;
                display: flex;
                align-items: center;
                justify-content: center;
                margin-bottom: 18px;
                color: var(--accent);
            }
        </style>
    </head>
    <body>
        <div class="card">
            <div class="logo-wrap">
                {% if site_logo %}
                <img src="{{ site_logo }}" alt="{{ site_nome }}" style="width:32px; height:32px; border-radius:8px; object-fit:cover; flex-shrink:0;">
                {% else %}
                <div class="logo-mark">{{ site_nome | truncate(length=1, end="") }}</div>
                {% endif %}
                <h1>
                    {{ site_nome }}
                    <span>Verificação em dois fatores</span>
                </h1>
            </div>

            <div class="icone-mfa">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="5" y="11" width="14" height="10" rx="2"/>
                    <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                </svg>
            </div>

            <p class="instrucao">
                Abra o app autenticador e informe o código de 6 dígitos gerado para esta conta.
            </p>

            {% if erro %}
            <p class="erro">{{ erro }}</p>
            {% endif %}

            <form method="post" action="/login/mfa">
                <input type="hidden" name="_csrf" value="{{ csrf }}">
                <label>Código de verificação</label>
                <input
                    type="text"
                    name="codigo"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    maxlength="7"
                    placeholder="000000"
                    required
                    autofocus
                >
                <button type="submit">Verificar</button>
            </form>

            <a href="/logout" class="voltar">← Voltar ao login</a>
        </div>
    </body>
</html>
